<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="320"
     viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="25" fill="url(#bg)"/>

  <!-- Moving glow -->
  <circle cx="100" cy="100" r="80" fill="#06b6d4" opacity="0.15">
    <animate attributeName="cx"
             values="100;1100;100"
             dur="15s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Stars -->
  <g fill="white">

    <circle cx="80" cy="60" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="230" r="1.5">
      <animate attributeName="opacity"
               values="1;.2;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="50" r="2">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="390" cy="260" r="1.5">
      <animate attributeName="opacity"
               values="1;.1;1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="55" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="2.3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="250" r="1.5">
      <animate attributeName="opacity"
               values="1;.2;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="65" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1130" cy="210" r="1.5">
      <animate attributeName="opacity"
               values="1;.2;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Code symbol -->
  <text x="110"
        y="190"
        font-size="70"
        font-family="monospace"
        font-weight="bold"
        fill="#22d3ee"
        opacity=".6">
    &lt;/&gt;

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="3s"
             repeatCount="indefinite"/>
  </text>

  <!-- Name -->
  <text x="600"
        y="115"
        text-anchor="middle"
        font-size="60"
        font-family="Arial"
        font-weight="bold"
        fill="#22d3ee"
        filter="url(#glow)">

    Nishant Kumar

    <animate attributeName="fill"
             values="#22d3ee;#8b5cf6;#ec4899;#22d3ee"
             dur="6s"
             repeatCount="indefinite"/>

  </text>

  <!-- Role -->
  <text x="600"
        y="170"
        text-anchor="middle"
        font-size="27"
        font-family="Arial"
        font-weight="bold"
        fill="white">

    Full Stack Developer

  </text>

  <!-- Animated line -->
  <rect x="450"
        y="190"
        width="300"
        height="3"
        rx="2"
        fill="#22d3ee">

    <animate attributeName="width"
             values="80;300;80"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="560;450;560"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="fill"
             values="#22d3ee;#a855f7;#ec4899;#22d3ee"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>

  <!-- Skills -->
  <text x="600"
        y="235"
        text-anchor="middle"
        font-size="19"
        font-family="monospace"
        fill="#cbd5e1">

    Java • Spring Boot • React.js • Python • GenAI

  </text>

  <!-- Bottom -->
  <text x="600"
        y="275"
        text-anchor="middle"
        font-size="16"
        font-family="monospace"
        fill="#67e8f9">

    Building Intelligent Full-Stack Applications 🚀

    <animate attributeName="opacity"
             values=".4;1;.4"
             dur="2.5s"
             repeatCount="indefinite"/>

  </text>

</svg>
